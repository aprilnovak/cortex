[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-tea"
version = "0.1.0"
description = "Techno-economic analysis (TEA) manufacturing cost model for fusion reactor components"
requires-python = ">=3.9"
dependencies = ["matplotlib", "numpy"]

[project.optional-dependencies]
webapp = ["fastapi", "uvicorn", "pydantic"]
notebook = ["pandas", "ipykernel"]

# Everything installs under the one `cortex_tea` package. The three
# databases are folders of plain data files, not subpackages, so they ship as
# package data; tea_api finds them next to itself.
[tool.setuptools]
packages = ["cortex_tea"]

[tool.setuptools.package-data]
cortex_tea = [
    "database_materials/*.py",
    "database_processes/*.py",
    "database_geometries/*.py",
]
